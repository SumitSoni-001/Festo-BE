services:
  postgres:
    image: postgres:16-alpine
    container_name: festo-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - festo-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: festo-redis
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - festo-redis-data:/data

volumes:
  festo-postgres-data:
  festo-redis-data:
