services:
  postgres:
    image: postgres:16-alpine
    container_name: festo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-festo}
      POSTGRES_USER: ${DB_USERNAME:-festo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-festo}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - festo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-festo}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: festo-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - festo-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  festo-postgres-data:
  festo-redis-data:
