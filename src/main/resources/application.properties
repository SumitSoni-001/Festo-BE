spring.application.name=festo_be

server.port=${SERVER_PORT:8081}

# PostgreSQL - see System Architecture Decisions Log
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:festo}
spring.datasource.username=${DB_USERNAME:festo}
spring.datasource.password=${DB_PASSWORD:festo}

## ddl-auto=update until schema stabilizes, then switch to validate + Flyway baseline.
# Two things it can never create - add by hand against the dev DB for now (DB Design 6.1, 6.4):
#   CREATE UNIQUE INDEX uk_booking_active_user_event ON booking (user_id, event_id)
#     WHERE status != 'CANCELLED';
#   ALTER TABLE event_ticket_type ADD CONSTRAINT chk_available_quantity_nonneg
#     CHECK (available_quantity >= 0);
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true

# Redis - OTPs, refresh tokens, webhook idempotency (DB Design 1.3)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# override jwt.secret via env var in every real environment
jwt.secret=${JWT_SECRET:dev-only-secret-change-via-env-var-before-any-real-deployment}
jwt.access-token-expiry-minutes=15
jwt.refresh-token-expiry-days=7

spring.jackson.default-property-inclusion=non_null
